name: Inspecter le code de Verus (quelles fonctions de calcul sont utilisées ?)

# Rien n'est compilé ni publié : on lit seulement le « Summary ».
# Objectif : voir comment le calcul du hash Verus est organisé et quelles parties dépendent de l'architecture
# (64 bits ou 32 bits).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecter:
    name: Lire le code source de ccminer
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Récupérer le code de ccminer
        run: git clone --depth 1 https://github.com/Oink70/CCminer-ARM-optimized.git src

      - name: Résumé
        run: |
          cd src
          INC="--include=*.c --include=*.cpp --include=*.cc --include=*.h --include=*.hpp"
          {
            echo "## Version du code"
            echo '```'
            git rev-parse HEAD
            echo '```'

            echo "## Blocs propres à une architecture (64 bits, 32 bits, grands entiers)"
            echo '```'
            grep -rnE "__aarch64__|__arm__|__ARM_ARCH|__ARM_FEATURE|__SIZEOF_|__LP64__|__ILP32__|__int128" $INC --exclude=sse2neon.h -B1 -A2 verus *.cpp *.c *.h 2>/dev/null | head -320 | cut -c1-170
            echo '```'

            echo "## Définition de _mm_roti_epi64"
            echo '```'
            grep -rn -B1 -A8 "define _mm_roti_epi64\|_mm_roti_epi64 *(" $INC --exclude=sse2neon.h . | head -40 | cut -c1-170
            echo '```'

            echo "## verus/verusscan.cpp (lignes 100 à 290)"
            echo '```'
            sed -n 100,290p verus/verusscan.cpp | cut -c1-170
            echo '```'

            echo "## verus/verus_hash.cpp (lignes 90 à 180)"
            echo '```'
            sed -n 90,180p verus/verus_hash.cpp | cut -c1-170
            echo '```'

            echo "## verus/verus_clhash.h (entier)"
            echo '```'
            cat verus/verus_clhash.h | cut -c1-400
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
